set_party_pause:
  name: Set party or pause mode
  description: Activate party or pause mode for a configured heating circuit.
  fields:
    entry_id:
      name: Entry ID
      description: Config entry ID. Required when multiple WAB11 integrations are configured.
      selector:
        text:
    circuit:
      name: Heating circuit
      description: Heating circuit number.
      required: true
      selector:
        number:
          min: 1
          max: 5
          mode: box
    mode:
      name: Mode
      description: Party or pause mode.
      required: true
      selector:
        select:
          options:
            - party
            - pause
    hours:
      name: Duration
      description: Duration in hours.
      selector:
        number:
          min: 0.5
          max: 12
          step: 0.5
          mode: box

cancel_party_pause:
  name: Cancel party or pause mode
  description: Return a heating circuit to automatic party/pause behaviour.
  fields:
    entry_id:
      name: Entry ID
      description: Config entry ID. Required when multiple WAB11 integrations are configured.
      selector:
        text:
    circuit:
      name: Heating circuit
      description: Heating circuit number.
      required: true
      selector:
        number:
          min: 1
          max: 5
          mode: box

trigger_hot_water_push:
  name: Trigger hot water push
  description: Start a hot-water push cycle for the requested duration.
  fields:
    entry_id:
      name: Entry ID
      description: Config entry ID. Required when multiple WAB11 integrations are configured.
      selector:
        text:
    minutes:
      name: Minutes
      description: Duration in minutes.
      selector:
        number:
          min: 0
          max: 240
          step: 5
          mode: box

cancel_hot_water_push:
  name: Cancel hot water push
  description: Stop an active hot-water push cycle.
  fields:
    entry_id:
      name: Entry ID
      description: Config entry ID. Required when multiple WAB11 integrations are configured.
      selector:
        text:
